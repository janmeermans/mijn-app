<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b1d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hartenjagen">
  <title>Hartenjagen</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root { --felt-dark:#0b1d12; --muted:#86efac; --gold:#fbbf24; --card:#fff7ed; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:none; }
    html,body{margin:0;height:100%;overflow:hidden;background:var(--felt-dark);color:#f8fafc;font-family:"Press Start 2P",ui-monospace,monospace;}
    body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
    #app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;background:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 4px,transparent 4px 8px),radial-gradient(circle at 50% 28%,#166534,var(--felt-dark) 72%);}
    header{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;padding:8px 8px 4px;}
    .score{background:#052e16;border:3px solid #022c22;box-shadow:3px 3px 0 #022c22;padding:6px 4px;text-align:center;}
    .score b{display:block;font-size:8px;color:var(--muted);margin-bottom:4px;}
    .score span{font-size:12px;color:var(--gold);}
    .score.you{border-color:var(--gold);}
    #table{position:relative;min-height:0;}
    .seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;}
    #north{top:4px;left:50%;transform:translateX(-50%);}
    #west{left:6px;top:48%;transform:translateY(-50%);}
    #east{right:6px;top:48%;transform:translateY(-50%);}
    .who{font-size:8px;color:var(--muted);text-shadow:2px 2px 0 #022c22;}
    .pile{width:30px;height:42px;background:repeating-linear-gradient(45deg,#1e3a8a 0 4px,#2563eb 4px 8px);border:3px solid #0f172a;box-shadow:3px 3px 0 #022c22;}
    .count{font-size:8px;color:var(--gold);}
    #trick{position:absolute;inset:18% 20% 16%;display:grid;grid-template-areas:". n ." "w . e" ". s .";grid-template-columns:1fr auto 1fr;grid-template-rows:1fr auto 1fr;place-items:center;border:3px dashed transparent;}
    #trick.hot{border-color:var(--gold);background:rgba(251,191,36,.12);}
    #slot-n{grid-area:n;}#slot-w{grid-area:w;}#slot-e{grid-area:e;}#slot-s{grid-area:s;}
    .pcard,.hcard{width:44px;height:60px;background:var(--card);border:3px solid #111827;box-shadow:3px 3px 0 #022c22;color:#111827;display:flex;flex-direction:column;justify-content:space-between;padding:3px 3px 2px;font-size:9px;user-select:none;}
    .pcard.red,.hcard.red{color:#be123c;}
    .pcard .big,.hcard .big{text-align:center;font-size:14px;line-height:1;}
    #status{min-height:28px;padding:0 10px 4px;font-size:8px;line-height:1.5;color:#ecfccb;text-align:center;text-shadow:2px 2px 0 #022c22;}
    #hand{height:236px;display:grid;grid-template-rows:1fr 1fr 1fr 1fr;padding:0 6px 6px;gap:2px;}
    .row{position:relative;min-height:0;}
    .row-tag{position:absolute;left:0;top:4px;z-index:20;font-size:10px;color:#ecfccb;text-shadow:2px 2px 0 #022c22;pointer-events:none;}
    .hcard{position:absolute;top:2px;width:46px;height:52px;}
    .hcard.on{outline:3px solid var(--gold);transform:translateY(-4px);}
    .hcard.off{opacity:.34;filter:grayscale(.35);}
    .hcard.drag{position:fixed;z-index:50;pointer-events:none;transform:scale(1.08) rotate(-6deg);}
    #bar{display:flex;gap:8px;padding:0 10px 12px;}
    button{flex:1;font:inherit;font-size:9px;color:#111827;background:var(--gold);border:3px solid #111827;box-shadow:3px 3px 0 #022c22;padding:11px 8px;}
    button:disabled{background:#64748b;color:#e2e8f0;}
    button.ghost{background:#86efac;}
    #overlay{position:fixed;inset:0;background:rgba(2,12,8,.82);display:none;align-items:center;justify-content:center;padding:18px;z-index:20;}
    #overlay.show{display:flex;}
    .panel{width:min(360px,100%);background:#052e16;border:4px solid #fbbf24;box-shadow:6px 6px 0 #022c22;padding:16px;text-align:center;}
    .panel h1{font-size:14px;margin:0 0 12px;color:var(--gold);}
    .panel p{font-size:8px;line-height:1.7;color:#d9f99d;}
    .rows{display:grid;gap:6px;margin:12px 0;text-align:left;font-size:8px;}
    .rows div{display:flex;justify-content:space-between;}
  </style>
</head>
<body>
  <div id="app">
    <header id="scores"></header>
    <div id="table">
      <div class="seat" id="north"><div class="who">NOORD</div><div class="pile"></div><div class="count" id="n-count"></div></div>
      <div class="seat" id="west"><div class="who">WEST</div><div class="pile"></div><div class="count" id="w-count"></div></div>
      <div class="seat" id="east"><div class="who">OOST</div><div class="pile"></div><div class="count" id="e-count"></div></div>
      <div id="trick"><div id="slot-n"></div><div id="slot-w"></div><div id="slot-e"></div><div id="slot-s"></div></div>
    </div>
    <div id="status"></div>
    <div id="hand"></div>
    <div id="bar"><button class="ghost" id="btn-new">NIEUW</button><button id="btn-act" disabled>GEEF DOOR</button></div>
  </div>
  <div id="overlay"><div class="panel" id="panel"></div></div>
  <script src="./game.js"></script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");</script>
</body>
</html>
